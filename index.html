<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Summary</title>
    <link rel="icon" type="image/png" href="./images/favicon-32x32.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="main">
      <div class="container">
        <div class="hero" aria-label="Person listening to music">
          <img src="./images/illustration-hero.svg" alt="Person listening to music" />
        </div>

        <div class="content">
          <h1 class="heading">Order Summary</h1>

          <p class="summary-para">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

          <div class="plan-text">
            <div class="plan-icon" aria-hidden="true">
              <img src="./images/icon-music.svg" alt="" />
            </div>

            <p class="plan-title">
              <span class="plan-label">Annual Plan</span>
              <span class="plan-price">$59.99/year</span>
            </p>

            <div class="change-link">
              <a href="#">Change</a>
            </div>
          </div>

          <button class="proceed-btn" type="button">Proceed to Payment</button>
          <a href="#" class="cancel-order">Cancel Order</a>
        </div>
      </div>

      <footer class="footer" aria-label="Footer">
        <a href="https://www.crio.do/" target="_blank" rel="noreferrer">Crio</a>
        <span class="footer-divider">•</span>
        <a href="https://github.com/Jitesh0404/XORDER-SUMMARY" target="_blank" rel="noreferrer">GitHub</a>
      </footer>
    </main>
  </body>
</html>
